<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#555;stroke-width:1.3}
      .rt{fill:#e8f0fe;stroke:#3b6fd4;stroke-width:1.5}
      .ex{fill:#fff4e0;stroke:#d98a00;stroke-width:1.3}
      .sh{fill:#e6f6ea;stroke:#2e9b4f;stroke-width:1.5}
      .hs{fill:#fde8e8;stroke:#c93c3c;stroke-width:1.5}
      .ln{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .dashA{stroke:#999;stroke-width:1;stroke-dasharray:4 3;fill:none;marker-end:url(#a)}
      .dash{stroke:#999;stroke-width:1;stroke-dasharray:4 3;fill:none}
      .t{fill:#222} .s{fill:#666;font-size:11.5px} .h{font-weight:700;font-size:15px;fill:#222}
    </style>
  </defs>
  <rect width="1000" height="700" fill="#fafafa"/>
  <text x="500" y="30" text-anchor="middle" class="h" font-size="19">Mixtral 8x7B 的 MoE 層（取代 Transformer block 的 FFN）</text>
  <text x="110" y="62" text-anchor="middle" class="h">一個 Transformer block</text>
  <rect x="30" y="75" width="160" height="40" rx="6" class="box"/>  <text x="110" y="100" text-anchor="middle" class="t">輸入 x（殘差流）</text>
  <rect x="30" y="145" width="160" height="50" rx="6" class="box"/>  <text x="110" y="166" text-anchor="middle" class="t">Attention</text>
  <text x="110" y="183" text-anchor="middle" class="s">（本圖不展開）</text>
  <rect x="30" y="225" width="160" height="50" rx="6" class="rt"/>  <text x="110" y="247" text-anchor="middle" class="t" font-weight="700">MoE FFN</text>
  <text x="110" y="264" text-anchor="middle" class="s">← 右側展開</text>
  <rect x="30" y="305" width="160" height="40" rx="6" class="box"/>  <text x="110" y="330" text-anchor="middle" class="t">輸出</text>
  <path d="M110 115V143M110 195V223M110 275V303" class="ln"/>
  <text x="110" y="378" text-anchor="middle" class="s">每層 8 個 FFN expert</text>
  <text x="110" y="394" text-anchor="middle" class="s">47B 總參數／13B 啟用</text>
  <text x="110" y="410" text-anchor="middle" class="s">context 32k</text>
  <path d="M190 250H245" class="dash"/>
  <rect x="235" y="55" width="745" height="380" rx="10" fill="none" stroke="#3b6fd4" stroke-dasharray="6 4"/>
  <rect x="260" y="85" width="170" height="38" rx="6" class="box"/>  <text x="345" y="109" text-anchor="middle" class="t">token 向量 x</text>
  <rect x="260" y="160" width="170" height="75" rx="6" class="rt"/>  <text x="345" y="182" text-anchor="middle" class="t" font-weight="700">Router</text>
  <text x="345" y="201" text-anchor="middle" class="s">線性層 x·W_g → 8 個 logits</text>
  <text x="345" y="216" text-anchor="middle" class="s">（無 shared expert）</text>
  <path d="M345 123V158" class="ln"/>
  <rect x="260" y="265" width="170" height="68" rx="6" class="rt"/>  <text x="345" y="285" text-anchor="middle" class="t" font-weight="700">top-2 選擇</text>
  <text x="345" y="303" text-anchor="middle" class="s">只對選中的 2 個 logits</text>
  <text x="345" y="318" text-anchor="middle" class="s">做 softmax → 權重</text>
  <path d="M345 235V263" class="ln"/>
  <path d="M430 295H450V118H468" class="ln"/>
  <text x="700" y="82" text-anchor="middle" class="h" font-size="13">Routed experts：8 個（✓ = 被選中）</text>
  <rect x="470" y="95" width="75" height="46" rx="5" class="ex"/>  <text x="507.5" y="123" text-anchor="middle" class="t">E1</text>
  <rect x="553" y="95" width="75" height="46" rx="5" class="ex" stroke-width="3"/>  <text x="590.5" y="123" text-anchor="middle" class="t">E2 ✓</text>
  <rect x="636" y="95" width="75" height="46" rx="5" class="ex"/>  <text x="673.5" y="123" text-anchor="middle" class="t">E3</text>
  <text x="724" y="123" text-anchor="start" class="t">…</text>
  <rect x="749" y="95" width="75" height="46" rx="5" class="ex" stroke-width="3"/>  <text x="786.5" y="123" text-anchor="middle" class="t">E7 ✓</text>
  <rect x="832" y="95" width="75" height="46" rx="5" class="ex"/>  <text x="869.5" y="123" text-anchor="middle" class="t">E8</text>
  <path d="M700 141V183" class="ln"/>
  <rect x="470" y="185" width="460" height="118" rx="8" class="box"/>  <text x="700" y="205" text-anchor="middle" class="h" font-size="13">每個 expert：SwiGLU FFN（只計算被選中的 2 個）</text>
  <text x="700" y="245" text-anchor="middle" class="s">8 個 expert 結構相同、參數各自獨立</text>
  <text x="700" y="263" text-anchor="middle" class="s">輸出 = Σ softmax(top-2 logits)ᵢ · Eᵢ(x)</text>
  <text x="700" y="281" text-anchor="middle" class="s">（SwiGLU、softmax 作用於 top-2：論文 §2.1）</text>
  <path d="M260 104H248V347H796" class="dashA"/>
  <text x="540" y="342" text-anchor="middle" class="s">虛線：x 旁路至輸出端做殘差相加</text>
  <path d="M820 303V323" class="ln"/>
  <circle cx="820" cy="347" r="22" class="box"/>  <text x="820" y="354" text-anchor="middle" class="t" font-size="20">Σ</text>
  <path d="M842 347H872" class="ln"/>
  <text x="878" y="351" text-anchor="start" class="t">+ 殘差</text>
  <rect x="260" y="385" width="700" height="38" rx="6" fill="#fff" stroke="#bbb"/>  <text x="610" y="402" text-anchor="middle" class="t">Mixtral 無 shared expert；負載平衡不在本圖範圍</text>
  <text x="610" y="417" text-anchor="middle" class="s">每個 token 在每一層各自重新選 2 個 expert</text>
  <text x="500" y="470" text-anchor="middle" class="h" font-size="16">Dense FFN vs 稀疏 MoE（Mixtral）</text>
  <rect x="40" y="485" width="440" height="185" rx="8" class="box"/>  <text x="260" y="510" text-anchor="middle" class="h">Dense FFN</text>
  <text x="60" y="545" text-anchor="start" class="t">1. 每個 token 都經過同一組 FFN 參數</text>
  <text x="60" y="570" text-anchor="start" class="s">2. 啟用參數 = 總參數</text>
  <text x="60" y="595" text-anchor="start" class="s">3. 容量與計算量綁在一起</text>
  <text x="60" y="655" text-anchor="start" class="t" font-weight="700">x → FFN → 輸出</text>
  <rect x="520" y="485" width="440" height="185" rx="8" class="rt"/>  <text x="740" y="510" text-anchor="middle" class="h">Sparse MoE（Mixtral）</text>
  <text x="540" y="545" text-anchor="start" class="t">1. 8 個 FFN expert，每 token 只用 top-2</text>
  <text x="540" y="570" text-anchor="start" class="s">2. 總參數 47B，每 token 啟用約 13B</text>
  <text x="540" y="595" text-anchor="start" class="s">3. 容量與計算量解耦</text>
  <text x="540" y="655" text-anchor="start" class="t" font-weight="700">x → 打分 → top-2 → 加權求和</text>
  <text x="500" y="692" text-anchor="middle" class="s">來源：Jiang et al., 2024, arXiv 2401.04088（摘要：8 experts、top-2、47B／13B、32k；§2.1：SwiGLU 與 top-2 softmax）</text>
</svg>
